name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out signed tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Require a verified annotated tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; 'X-GitHub-Api-Version' = '2022-11-28' }
          $reference = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          if ($reference.object.type -ne 'tag') { throw 'Release tags must be annotated and signed.' }
          $tagObject = Invoke-RestMethod -Headers $headers -Uri $reference.object.url
          if (-not $tagObject.verification.verified) { throw "GitHub did not verify the release tag signature: $($tagObject.verification.reason)" }
          $version = (Get-Content -Raw plugin/rapid-pc-use/.codex-plugin/plugin.json | ConvertFrom-Json).version
          if ($tag -ne "v$version") { throw "Tag '$tag' does not match plugin version '$version'." }
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.110
      - name: Run non-interactive release gate
        shell: powershell
        run: .\scripts\verify.ps1 -SkipSmoke
      - name: Authenticode-sign driver
        shell: powershell
        env:
          RAPID_PC_USE_SIGNING_CERT_BASE64: ${{ secrets.RAPID_PC_USE_SIGNING_CERT_BASE64 }}
          RAPID_PC_USE_SIGNING_CERT_PASSWORD: ${{ secrets.RAPID_PC_USE_SIGNING_CERT_PASSWORD }}
        run: .\scripts\sign.ps1 -Executable .\plugin\rapid-pc-use\bin\win-x64\rapid-pc-use.exe
      - name: Repackage signed driver and create SBOM
        shell: powershell
        run: |
          .\scripts\package.ps1 -SkipBuild
          .\scripts\sbom.ps1
      - name: Attest release archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: dist/rapid-pc-use-win-x64.zip
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rapid-pc-use-${{ github.ref_name }}
          path: |
            dist/rapid-pc-use-win-x64.zip
            dist/rapid-pc-use-win-x64.zip.sha256
            dist/rapid-pc-use.spdx.json
          if-no-files-found: error
      - name: Create pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --prerelease --generate-notes `
            dist/rapid-pc-use-win-x64.zip `
            dist/rapid-pc-use-win-x64.zip.sha256 `
            dist/rapid-pc-use.spdx.json
